<?xml version="1.0" encoding="UTF-8"?>
<!--
  XACO brand mark — DARK appearance variant.
  Same geometry as xaco-mark.svg; the BACK (black) card gets a white
  stroke so it doesn't melt into a dark background. FRONT card keeps
  its dark border so the rotated card still reads as a layered pair.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <!-- BACK : black flat upright with white outline for dark-mode contrast. -->
  <rect x="80" y="180" width="480" height="320" rx="22" ry="22"
        fill="#1A1816" stroke="#FFFFFF" stroke-width="10"/>

  <!-- FRONT : white card with thick black border, rotated 25° CW about pivot (560, 500) -->
  <rect x="80" y="180" width="480" height="320" rx="22" ry="22"
        fill="#FFFFFF" stroke="#1A1816" stroke-width="22"
        transform="rotate(25 560 500)"/>
</svg>
